{% for meal in meals %}
<article>
    <header><strong>{{ meal.day }}</strong> — {{ meal.group }}</header>
    <table>
        <tbody>
            {% for food in meal.foods %}
            <tr><td colspan="2" class="food-name">{{ food.food_name | highlight(query) }}</td></tr>
            <tr>
                <td style="color:var(--pico-muted-color); font-size:0.85rem; padding-top:0; padding-bottom:0.75rem">{{ food.amount }}</td>
                <td style="text-align:right; font-size:0.85rem; padding-top:0; padding-bottom:0.75rem; white-space:nowrap">{{ "%.1f" | format(food.kcal) }} kcal</td>
            </tr>
            {% endfor %}
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td style="text-align:right; white-space:nowrap">{{ "%.1f" | format(meal.total_kcal) }} kcal</td>
            </tr>
        </tfoot>
    </table>
</article>
{% endfor %}
