<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cronometer Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://unpkg.com/htmx.org@2.0/dist/htmx.min.js"></script>
    <script>
        function shrinkToFit(el) {
            el.style.fontSize = '';
            if (el.scrollWidth <= el.clientWidth) return;
            const ratio = el.clientWidth / el.scrollWidth;
            const current = parseFloat(getComputedStyle(el).fontSize);
            el.style.fontSize = Math.max(8, current * ratio - 0.5) + 'px';
        }
        document.addEventListener('htmx:afterSwap', () =>
            document.querySelectorAll('.food-name').forEach(shrinkToFit)
        );
    </script>
    <style>
        mark { padding: 0 2px; border-radius: 2px; }
        #reload-msg { font-size: 0.85rem; color: var(--pico-muted-color); }
        table { table-layout: fixed; width: 100%; margin-bottom: 0; }
        tfoot td { font-weight: bold; }
        .food-name { white-space: nowrap; overflow: hidden; }
        .search-bar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
        .search-bar input[type="search"] { flex: 1; margin: 0; }
        .search-bar button { margin: 0; width: auto; }
        .controls { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
        .controls label { display: flex; align-items: center; gap: 0.5rem; margin: 0; }
        .controls input[type="number"] { width: 5rem; margin: 0; }
        .controls button { margin: 0; width: auto; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Cronometer Search</h1>
        <div class="search-bar">
            <input
                type="search"
                name="q"
                placeholder="Search food name…"
                autofocus
                autocomplete="off"
                hx-get="/search"
                hx-trigger="input changed delay:150ms"
                hx-target="#results"
                hx-include="[name='count']"
            >
            <button class="secondary" onclick="document.getElementById('controls').toggleAttribute('hidden')">⚙</button>
        </div>
        <div id="controls" hidden>
            <div class="controls">
                <label>
                    Meals:
                    <input
                        type="number"
                        name="count"
                        value="3"
                        min="1"
                        max="50"
                        hx-get="/search"
                        hx-trigger="change"
                        hx-target="#results"
                        hx-include="[name='q']"
                    >
                </label>
                <button
                    class="secondary"
                    hx-post="/reload"
                    hx-target="#reload-msg"
                    hx-swap="innerHTML"
                >Reload CSV</button>
                <span id="reload-msg"></span>
            </div>
        </div>
        <div id="results"></div>
    </main>
</body>
</html>
